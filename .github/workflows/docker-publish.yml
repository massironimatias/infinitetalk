name: Compilar y Subir a Docker Hub

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la imagen (ej: test1, test2, test3)'
        required: false
        default: 'test2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco agresivamente (75+ GB)
        run: |
          echo "=== Espacio antes de la limpieza ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo docker system prune -a --volumes -f || true
          echo "=== Espacio después de la limpieza ==="
          df -h

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Determinar etiqueta de versión
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="test2"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🚀 Se compilará con el tag: $TAG"

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            massironimatias/infinitetalk:${{ steps.vars.outputs.tag }}
            massironimatias/infinitetalk:latest
