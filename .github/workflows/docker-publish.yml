name: Compilar y Subir a Docker Hub

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite ejecutar el build manualmente desde la pestaña de Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco (Maximizando almacenamiento para modelos IA)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: massironimatias/infinitetalk:latest
